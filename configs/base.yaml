defaults:
  - env: pointmaze_medium_navigate
  - model: treewm
  - _self_
  # Listed after _self_ so an experiment file overrides the defaults below it.
  - experiment: null

# ----------------------------------------------------------------------- run
seed: 0
arm: treewm            # singlewm | flatkwm | fixedtreewm | randomtreewm |
                       # uncertaintytreewm | heuristictreewm | treewm
objective_version: treewm_v1
device: cuda
run_root: runs
run_name: null         # defaults to <date>_seed<seed>
resume: null           # path to a checkpoint, or "auto" to pick up latest.pt

# Used by scripts/eval.py, scripts/sweep_budget.py and scripts/visualize_tree.py.
checkpoint: null
budgets: null

# ------------------------------------------------------------------- training
train:
  steps: 50000
  # Optional fixed cosine horizon. Null preserves historical behaviour (use `steps`).
  # Short formal-v2 pilots pin this to 1M so their first 5k updates are an exact
  # optimizer/scheduler prefix of the million-update campaign.
  scheduler_total_steps: null
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  min_lr_scale: 0.1
  grad_clip: 1.0
  separate_gain_grad_clip: false
  world_grad_clip: 1.0
  gain_grad_clip: 1.0
  grad_accum: 1
  gradient_checkpointing: true  # required activation rematerialisation for formal runs
  bf16: true                 # A100 default (spec section 24)
  num_workers: 12
  max_train_anchors: 200000
  max_val_anchors: 20000
  log_every: 50
  hist_every: 500
  diag_every: 1000
  eval_every: 10000
  viz_every: 500          # after viz_early_until
  viz_every_early: 250    # dense early, when tree structure changes fastest
  viz_early_until: 2000
  viz_anchors: 4          # fixed diagnostic anchors rendered during training
  ckpt_every: 2000
  # Null preserves historical behavior: validation accompanies every checkpoint.
  # Formal campaigns may checkpoint more often than their fixed held-out evaluation.
  val_every: null
  val_batches: 20
  # Historical/v1 cadence. Corrected v2 recipes explicitly override this to every step.
  gain_loss_every: 4
  gain_batch_size: 64
  # Null preserves legacy shared-optimizer settings. Formal v2 pins a dedicated gain
  # optimizer policy independently of the world-model regularisation axis.
  gain_lr: null
  gain_weight_decay: null
  # Null preserves each historical arm's configured gain-tree scorer. Corrected v2
  # explicitly pins its deterministic mixed behavior policy.
  gain_training_scorers: null
  # Node budget for the tree grown *to train the gain head* -- small and uniform across
  # arms. This is NOT the evaluation budget. SingleWM's tree is a chain, so at the full
  # budget it runs 63 sequential expansions per gain step (measured ~2.2x slower overall
  # than FlatKWM) purely as a training artefact.
  gain_tree_budget: 64

# ----------------------------------------------------------------- tree/budget
tree:
  node_budget: 64
  expansion_batch_size: 4
  max_depth: 16
  branch_factor: 4
  context_pooling: mean      # none | mean | max  (ablation axis)
  scorer: null               # null -> use the arm's default scorer
  keep_threshold: null       # v2 pins a calibrated KEEP admission threshold

# ------------------------------------------------------- future sets / modes
future_sets:
  num_neighbors: 24
  query_multiplier: 6
  time_exclusion: 50
  retrieval_radius: 1.0
  include_self: true
  metric_mode: legacy_l2     # legacy_l2 | rms_v2
  horizons: [4, 8, 16, 32, 64]
  h_max: 64
  # Memory-map the preprocessed arrays from a shared on-disk cache instead of each job
  # loading and normalising its own copy (treewm/data/shared_cache.py). Essential when
  # 16 jobs share one host: antsoccer alone is 4M x 42 per process otherwise.
  shared_cache: false
  # selected_seed preserves historical per-seed slices. published_union consumes the
  # exact union already sealed into a compatible formal future recipe.
  recipe_anchor_policy: selected_seed  # selected_seed | published_union
  horizon_rule: displacement
  displacement_threshold: 0.25
  fixed_horizon: 32
  relative_endpoints: true
  # Tuned on pointmaze-medium: yields ~3 modes/anchor (max 5) and spreads predicted
  # horizons across all five candidates.
  cluster_threshold: 0.25
  cluster_method: average
  max_modes: 8
  multi_step_depth: 3   # Track A: chain length supervised along the anchor's own future
  retrieval_pool: 0     # 0 = whole dataset; subsample for high-dim observations
  cache: false          # cache built future sets per anchor (big win for long runs)

# ------------------------------------------------ latent retrieval (gain target)
retrieval:
  enabled: true
  num_keys: 100000
  num_neighbors: 16
  refresh_every: 2000
  query_chunk: 4096
  key_chunk: 50000
  endpoint_horizon: 32
  grid_resolution: 0.2

# ------------------------------------------------------------------- matching
matching:
  lambda_z: 1.0
  lambda_q: 1.0
  lambda_action: 0.5
  lambda_horizon: 0.1
  method: hungarian          # hungarian | greedy
  normalization_version: legacy  # legacy | rms_v2
  num_horizons: 5

# --------------------------------------------------------------------- losses
losses:
  control_objective: future_set   # future_set | contrastive | bootstrap
  # Expansion-gain supervision target.
  #   novelty   -> G*(n|T) = min_j d(q_n, q_j), the signal the winning heuristic uses
  #   retrieval -> marginal new quantised cells from dataset neighbours (original)
  gain_target: novelty
  # Track A2 -- scheduled sampling on the multi-step recursive rollout.
  scheduled_sampling_p: 0.0
  scheduled_sampling_warmup: 2000
  # Track H2 -- per-depth weights for the multi-step loss ([] -> uniform).
  multistep_depth_weights: []
  redundancy_temperature: 0.25
  contrastive_temperature: 0.1
  keep_balance: true
  coverage_space: q               # q | z  (ablation axis)
  # Auxiliary terms ramp in linearly; redundancy is degenerate before the branch heads
  # differentiate and would otherwise drive every KEEP score to zero.
  warmup:
    redundancy: 5000
    expand: 2000
    mass: 1000
  # Anneal the redundancy penalty out after it has separated the branch heads. Left on,
  # it is minimised by collapsing branches rather than diversifying them: measured
  # effective branching factor 1.7 -> 1.06 over 200k steps on three environments, with
  # success falling ~10x alongside it. 0 = no decay.
  decay:
    redundancy: 0
  future_scale: 1.0
  # V2 objective switches. Historical defaults remain explicit so old runs never
  # acquire new semantics merely by importing a newer library.
  control_target_transform: linear  # linear | rms_tanh
  control_endpoint_key: fut_endpoint
  control_allow_endpoint_fallback: true
  control_require_single_scale: false
  control_metric_weight: 1.0
  control_rank_weight: 0.0
  control_rank_temperature: 0.1
  detach_world_targets: false
  bind_negative_margin: 0.0
  gain_set_context: false
  gain_rank_weight: 0.0
  gain_calibration_weight: 1.0
  gain_branch_prior_weight: 0.0
  # Anchors per step for the controllability objective; the future-set Chamfer
  # distance is O(B^2 * M^2) and dominates the step at the full batch size.
  control_batch: 64
  # Successors per step for the recursive-consistency loss; O(B*K^2) otherwise.
  recursive_batch: 256
  weights:
    state: 1.0
    action: 1.0
    horizon: 0.5
    coverage: 1.0
    redundancy: 0.1
    mass: 0.2
    keep: 0.5
    expand: 0.5
    bind: 1.0
    control: 0.5
    reconstruction: 0.1
    recursive: 0.2
    uncertainty: 0.2
    multistep: 0.0
  enabled:
    state: true
    action: true
    horizon: true
    coverage: true
    redundancy: true
    mass: true
    keep: true
    expand: true
    bind: true
    control: true
    reconstruction: true
    recursive: true
    uncertainty: true
    multistep: false

# -------------------------------------------------------------------- planner
planner:
  # decoded | latent -- decoded nearly doubles success (see README, exp 3 D3)
  score_space: decoded
  # normalized_l2 preserves historical runs; domain_raw uses raw task units/semantics.
  decoded_metric: normalized_l2  # normalized_l2 | domain_raw
  score_mode: endpoint      # endpoint | path_aware | ancestor   (Track F)
  path_cost_weight: 0.02
  ancestor_weight: 0.5
  execute_mode: clipped     # clipped | fixed | full             (Track E)
  execute_steps: 16
  max_env_steps: 500
  use_uncertainty: false
  uncertainty_weight: 0.0
  exclude_root: true
  require_first_edge_improvement: false
  min_first_edge_improvement: 0.0

# ----------------------------------------------------------------- evaluation
eval:
  budgets: [16, 32, 64, 128, 256]
  episodes_per_task: 5
  final_episodes_per_task: 50
  # "hard" is the primary split: geodesically distant start/goal pairs.
  # "standard" is the environment's own five tasks.
  task_split: hard
  num_hard_tasks: 10
  hard_percentile: 75.0
  seed: 0
