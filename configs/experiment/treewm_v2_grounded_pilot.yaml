# @package _global_
#
# Clean-restart diagnostic objective after the stopped formal-v2 campaign. This is a
# bounded pilot, not a promotable 1M recipe: it corrects planner/validation semantics and
# exercises trajectory-grounded recursive training while retaining the calibrated v2
# future recipes. Promotion is decided from held-out loss, q/gain gates, and rollouts.

objective_version: treewm_v2_grounded_pilot_v1

train:
  # Regularisation bundle selected as one axis of the corrected 2x2 pilot. Individual
  # arms override these back to the v2 values so its effect remains identifiable.
  lr: 1.0e-4
  weight_decay: 1.0e-3
  separate_gain_grad_clip: true
  world_grad_clip: 1.0
  gain_grad_clip: 1.0

model:
  scales: [[mixed, 32, 1.0]]
  use_depth_embedding: false
  dropout: 0.1
  max_depth: 3

tree:
  keep_threshold: 0.5
  # Training provides three grounded recursive transitions. Do not ask inference to
  # rank unsupported depth-4+ hallucinations in this pilot.
  max_depth: 3

future_sets:
  metric_mode: rms_v2
  # Consume the immutable normalised memmaps and compatible future recipes. The raw
  # per-item future-set cache stays disabled because the recipe is the sole target rail.
  cache: false
  shared_cache: true
  retrieval_pool: 50000
  retrieval_radius: -1.0
  displacement_threshold: -1.0
  cluster_threshold: -1.0
  max_modes: 4

matching:
  normalization_version: rms_v2
  num_horizons: 5

retrieval:
  enabled: false
  num_keys: 0

losses:
  control_objective: future_set
  control_target_transform: rms_tanh
  control_endpoint_key: fut_metric_endpoint
  control_allow_endpoint_fallback: false
  control_require_single_scale: true
  control_metric_weight: 1.0
  control_rank_weight: 1.0
  control_rank_temperature: 0.2
  detach_world_targets: true
  bind_negative_margin: 0.1
  gain_target: novelty
  gain_set_context: true
  gain_rank_weight: 1.0
  gain_calibration_weight: 0.1
  gain_branch_prior_weight: 0.0
  keep_balance: false
  scheduled_sampling_p: 0.25
  scheduled_sampling_warmup: 5000
  multistep_depth_weights: [1.0, 1.0, 1.0]
  weights:
    mass: 0.0
    multistep: 1.0
  enabled:
    mass: false
    multistep: true
  decay:
    redundancy: 0

planner:
  decoded_metric: domain_raw
  execute_mode: clipped
  execute_steps: 4
