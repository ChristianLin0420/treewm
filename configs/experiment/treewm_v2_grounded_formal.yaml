# @package _global_
#
# Fresh 1M grounded TreeWM formal objective. The campaign package redundantly overrides
# every material field; these defaults keep direct composition fail-closed and ensure
# this formal objective never inherits the bounded pilot's identity or anchor policy.

objective_version: treewm_v2_grounded_formal_v1

train:
  # A direct composition must carry the same scientific horizon as the guarded
  # campaign. Missing campaign/data provenance will then fail closed before training;
  # it can never silently become an unrelated 50k experiment.
  steps: 1000000
  scheduler_total_steps: 1000000
  ckpt_every: 1000
  val_every: 2000
  diag_every: 2000
  eval_every: 25000
  num_workers: 10
  gradient_checkpointing: true
  lr: 1.0e-4
  weight_decay: 1.0e-3
  separate_gain_grad_clip: true
  world_grad_clip: 1.0
  gain_grad_clip: 1.0
  gain_loss_every: 1
  gain_lr: 3.0e-4
  gain_weight_decay: 0.0
  gain_training_scorers: [learned, novelty_q]

model:
  scales: [[mixed, 32, 1.0]]
  use_depth_embedding: false
  dropout: 0.1
  max_depth: 3

tree:
  keep_threshold: 0.5
  max_depth: 3

future_sets:
  metric_mode: rms_v2
  recipe_anchor_policy: published_union
  cache: false
  shared_cache: true
  retrieval_pool: 50000
  # Valid direct-composition defaults. The sealed campaign replaces all three with
  # each setting's protocol-bound calibration before any formal worker is launched.
  retrieval_radius: 1.0
  displacement_threshold: 0.25
  cluster_threshold: 0.25
  max_modes: 4
  multi_step_depth: 3

matching:
  normalization_version: rms_v2
  num_horizons: 5

retrieval:
  enabled: false
  num_keys: 0

losses:
  control_objective: future_set
  control_target_transform: rms_tanh
  control_endpoint_key: fut_metric_endpoint
  control_allow_endpoint_fallback: false
  control_require_single_scale: true
  control_metric_weight: 1.0
  control_rank_weight: 1.0
  control_rank_temperature: 0.2
  detach_world_targets: true
  bind_negative_margin: 0.1
  gain_target: novelty
  gain_set_context: true
  gain_rank_weight: 1.0
  gain_calibration_weight: 0.0
  gain_branch_prior_weight: 0.0
  keep_balance: false
  scheduled_sampling_p: 0.25
  scheduled_sampling_warmup: 5000
  multistep_depth_weights: [1.0, 1.0, 1.0]
  weights:
    mass: 0.0
    multistep: 1.0
  enabled:
    mass: false
    multistep: true
  decay:
    redundancy: 0

planner:
  decoded_metric: domain_raw
  execute_mode: clipped
  execute_steps: 4
  require_first_edge_improvement: true
  min_first_edge_improvement: 0.0

eval:
  task_split: standard
  episodes_per_task: 1
  final_episodes_per_task: 50
