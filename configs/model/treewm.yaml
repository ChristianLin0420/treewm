# @package model
z_dim: 128
q_dim: 64
hidden_dim: 256
encoder_hidden: 256
num_layers: 3
num_heads: 4
branch_factor: 4
h_max: 64
horizons: [4, 8, 16, 32, 64]
scales: [["short", 8, 1.0], ["medium", 32, 1.0]]
max_depth: 16
dropout: 0.0
reconstruction: true
residual_dynamics: true
normalize_q: true
use_tree_context: true
use_depth_embedding: true
novelty_space: q        # q | z -- overridden by the arm class
flatk_max: 256          # FlatKWM breadth; one checkpoint covers the whole budget curve
